<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Premium QR Card</title>

  <style>
    /* Import the font properly */
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background:
              radial-gradient(circle at top left, #dbeafe, transparent 35%),
              radial-gradient(circle at bottom right, #ede9fe, transparent 25%),
              linear-gradient(135deg, #f8fafc, #e2e8f0);
      overflow: hidden;
      position: relative;
    }

    /* Animated Background Blobs */
    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      animation: blobFloat 10s ease-in-out infinite alternate;
    }

    body::before {
      width: 300px;
      height: 300px;
      background: rgba(59, 130, 246, 0.4);
      top: 5%;
      left: 10%;
    }

    body::after {
      width: 350px;
      height: 350px;
      background: rgba(139, 92, 246, 0.3);
      bottom: 5%;
      right: 10%;
      animation-delay: -5s;
    }

    @keyframes blobFloat {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    /* === THE LIGHTS OUT OVERLAY === */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 30, 0.85); /* Deep dark blue */
      backdrop-filter: blur(12px);
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Trigger the background dimming when QR is hovered */
    body:has(.qr-wrap:hover) .bg-overlay {
      opacity: 1;
    }

    /* Main Card */
    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 340px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      border-right: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 30px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.15);
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      animation: cardEnter 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Card Darkens when QR is hovered */
    .card:has(.qr-wrap:hover) {
      background: rgba(15, 23, 42, 0.5);
      border-color: rgba(255, 255, 255, 0.05);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5);
    }

    /* Content Wrapper (Text & Button) */
    .card-content {
      transition: all 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Dim and blur the text when QR is hovered */
    .card:has(.qr-wrap:hover) .card-content {
      opacity: 0.15;
      filter: blur(4px);
      transform: translateY(10px) scale(0.96);
    }

    /* === QR CODE SECTION === */
    .qr-wrap {
      position: relative;
      z-index: 10; /* Keep high so it stays above the dimming */
      margin-bottom: 24px;
      cursor: pointer;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* The Ambient Glow behind the QR */
    .ambient-glow {
      position: absolute;
      inset: -2px;
      background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899, #3b82f6);
      background-size: 300%;
      border-radius: 24px;
      filter: blur(25px);
      opacity: 0;
      z-index: 1;
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      animation: rgbFlow 4s linear infinite;
    }

    @keyframes rgbFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }

    .qr-inner {
      position: relative;
      z-index: 2;
      border-radius: 20px;
      overflow: hidden;
      background: #fff;
      transition: all 0.5s ease;
    }

    .qr-inner img {
      width: 100%;
      display: block;
      position: relative;
      border-radius: 20px;
      z-index: 2;
    }

    /* Scanner Line Effect */
    .scanner-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 15px #fff, 0 0 30px #3b82f6;
      opacity: 0;
      z-index: 5;
    }

    /* QR Hover Triggers */
    .qr-wrap:hover {
      transform: translateY(-15px) scale(1.08);
    }

    .qr-wrap:hover .ambient-glow {
      opacity: 1;
      transform: scale(1.02);
    }

    .qr-wrap:hover .qr-inner {
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
    }

    .qr-wrap:hover .scanner-line {
      animation: scan 2s ease-in-out infinite;
    }

    @keyframes scan {
      0% { top: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    /* Typography & Button Details */
    .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #4f46e5;
      background: rgba(79, 70, 229, 0.1);
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    p {
      font-size: 15px;
      color: #64748b;
      line-height: 1.5;
      padding: 0 10px 16px;
    }

    .scan-btn {
      display: inline-block;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      color: white;
      padding: 12px 28px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      box-shadow: 0 10px 20px rgba(59, 130, 246, 0.25);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .scan-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 25px rgba(59, 130, 246, 0.4);
    }

    /* Footer Attribution */
    .attribution {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
      z-index: 2;
      transition: all 0.7s ease;
      animation: cardEnter 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .attribution a {
      color: #4338ca;
      text-decoration: none;
      font-weight: 600;
    }

    /* Dim attribution text on QR hover */
    body:has(.qr-wrap:hover) .attribution {
      opacity: 0.2;
      filter: blur(2px);
    }
  </style>
</head>
<body>

<!-- The overlay that darkens the whole page -->
<div class="bg-overlay"></div>

<div class="card">

  <!-- QR Code Container -->
  <div class="qr-wrap">
    <div class="ambient-glow"></div>
    <div class="qr-inner">
      <div class="scanner-line"></div>
      <img src="./images/image-qr-code.png" alt="QR Code">
    </div>
  </div>

  <!-- Text & Button Container -->
  <div class="card-content">
    <div class="tag">Frontend Practice</div>
    <h1>Improve your front-end skills by building projects</h1>
    <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level.</p>
  </div>

</div>

<footer class="attribution">
  Challenge by <a href="https://www.frontendmentor.io" target="_blank">Frontend Mentor</a>.
  Crafted by <a href="#">Prathviraj</a>.
</footer>

</body>
</html>
