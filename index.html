<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frontend Mentor | QR code component</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: hsl(212, 45%, 89%);
      font-family: 'Outfit', sans-serif;
    }

    .card{
      background:white;
      width:90%;
      max-width:320px;
      padding:16px;
      border-radius:20px;
      text-align:center;
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .card h1 {
      font-size: 22px;
      font-weight: 700;
      color: hsl(218, 44%, 22%);
      margin-bottom: 16px;
      padding: 0 10px;
    }

    .card p {
      font-size: 15px;
      font-weight: 400;
      color: hsl(220, 15%, 55%);
      line-height: 1.4;
      padding: 0 12px 12px;
    }

    .attribution {
      font-size: 11px;
      text-align: center;
      margin-top: 20px;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

  </style>
</head>
<body>

<div class="card">
  <img src="./images/image-qr-code.png" alt="QR Code">
  <h1>Improve your front-end skills by building projects</h1>
  <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
</div>

<footer class="attribution">
  Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
  Coded by <a href="#">NouvaZen</a>.
</footer>

</body>
</html>
